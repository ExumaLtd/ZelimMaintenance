name: Daily Dropbox Backup

on:
  schedule:
    - cron: '0 10 * * *' # Runs every day at 10:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install axios dropbox

    - name: Run Airtable Backup
      run: node scripts/airtable-backup.js
      env:
        AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}

    - name: Run Vercel Backup
      run: node scripts/vercel-backup.js
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # <--- THIS IS THE MISSING KEY
        DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
