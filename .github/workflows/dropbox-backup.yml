name: Daily Dropbox Backup

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 (Midnight) GMT
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install axios

    - name: Get Fresh Dropbox Access Token
      id: dropbox_token
      run: |
        # Use --data-urlencode to safely handle special characters in the refresh token
        response=$(curl -s -X POST https://api.dropbox.com/oauth2/token \
          -u "${{ secrets.DROPBOX_APP_KEY }}:${{ secrets.DROPBOX_APP_SECRET }}" \
          -d grant_type=refresh_token \
          --data-urlencode "refresh_token=${{ secrets.DROPBOX_REFRESH_TOKEN }}")
        
        echo "----------------------------------------------"
        echo "DEBUG: Response received"
        
        # Extract the token
        token=$(echo "$response" | jq -r '.access_token')
        
        # Check if the response actually contains a token
        if [ "$token" == "null" ] || [ -z "$token" ]; then
          echo "ERROR: Dropbox rejected the refresh token."
          echo "Full Response: $response"
          exit 1
        fi

        echo "temp_token=$token" >> $GITHUB_OUTPUT

    - name: Run Airtable Backup
      run: node scripts/airtable-backup.js
      env:
        AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        DROPBOX_ACCESS_TOKEN: "${{ steps.dropbox_token.outputs.temp_token }}"
        DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}

    - name: Run Vercel Backup
      run: node scripts/vercel-backup.js
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        DROPBOX_ACCESS_TOKEN: "${{ steps.dropbox_token.outputs.temp_token }}"
        DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}

    - name: Archive Repository (GitHub Code)
      run: zip -r zelim_source_code_backup.zip . -x "node_modules/*" ".git/*"

    - name: Upload Code Backup to Dropbox
      run: |
        curl -X POST https://content.dropboxapi.com/2/files/upload \
          --header "Authorization: Bearer ${{ steps.dropbox_token.outputs.temp_token }}" \
          --header "Dropbox-API-Arg: {\"path\": \"/GitHub/$(date +%Y)/$(date +%B)/$(date +%d-%m-%Y)/zelim_code_backup_$(date +%d%m%Y).zip\",\"mode\": \"overwrite\"}" \
          --header "Content-Type: application/octet-stream" \
          --data-binary @zelim_source_code_backup.zip