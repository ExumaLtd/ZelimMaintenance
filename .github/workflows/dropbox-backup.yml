name: Daily Dropbox Backup
on:
  schedule:
    - cron: '0 0 * * *' # Midnight every night
  workflow_dispatch: # This adds the "Run" button in GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios dropbox

      - name: Run Airtable Backup
        run: node scripts/airtable-backup.js
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}

      - name: Run Vercel Backup
        run: node scripts/vercel-backup.js
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}