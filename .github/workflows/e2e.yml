name: E2E

# Runs the Playwright suite against a deployed URL, normally a Vercel
# preview backed by the staging Airtable base. Manual trigger because it
# needs a live deployment and the E2E_ACCESS_PIN repository secret.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to test, e.g. a Vercel preview
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require the access pin secret
        # Without this, a missing secret would skip every test and the run
        # would report green having exercised nothing.
        run: |
          if [ -z "${{ secrets.E2E_ACCESS_PIN }}" ]; then
            echo "E2E_ACCESS_PIN secret is not configured; refusing to report an untested deployment as green" >&2
            exit 1
          fi
      - run: npx playwright test
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_ACCESS_PIN: ${{ secrets.E2E_ACCESS_PIN }}
          E2E_OPERATOR_PIN: ${{ secrets.E2E_OPERATOR_PIN }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
